services:
  - type: web
    name: vnr202
    runtime: node
    plan: free
    region: singapore
    branch: main
    repo: https://github.com/TaHoang715/VNR202
    buildCommand: npm ci --prefix server --include=dev && npm ci --prefix client --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: "1"
      - key: NODE_VERSION
        value: 22.16.0
